# site properties and page defaults
title: DBI Lab
subtitle: Behavioral Science • Digital Health • AI
description: Translational research lab at NUS integrating behavioral science, digital health, and AI to improve cardiometabolic health.
header: images/background.png
footer: images/background.png
proofer: false

# site social media and other links, needs to be changed accordingly.
links:
  email: dbi-lab@nus.edu.sg
  orcid: 0000-0002-4209-1647
  google-scholar: https://scholar.google.com/citations?user=Pw7AkzYAAAAJ&hl=en 
   

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
    permalink: /team/:name/
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
